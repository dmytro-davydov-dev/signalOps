# Scrapes every SignalOps process on the Compose network. DNS discovery
# resolves each service name to all of its replicas (`docker compose up --scale`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: signalops
    dns_sd_configs:
      - names:
          - api
          - normalizer
          - detector
          - graph-projector
          - dispatcher
          - investigation-worker
          - detector-closer
          - outbox-publisher
          - evaluation-worker
          - metrics-exporter
        type: A
        port: 9100
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
