[project]
name = "signalops"
version = "0.1.0"
description = "Turns noisy telemetry into evidence-backed software incident diagnoses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
signalops = "signalops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/signalops"]
