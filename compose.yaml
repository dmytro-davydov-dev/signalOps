name: signalops

# Local development stack. Single-node Kafka and local volumes give no
# protection against host or disk loss; see docs/reliability.md.
# Stateful services are reachable from the host only on 127.0.0.1.

x-backend-env: &backend-env
  SIGNALOPS_ENVIRONMENT: development
  SIGNALOPS_LOG_LEVEL: ${SIGNALOPS_LOG_LEVEL:-INFO}
  SIGNALOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signalops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-signalops}
  SIGNALOPS_REDIS_URL: redis://redis:6379/0
  SIGNALOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Only the deterministic fake provider exists; no model key is read.
  SIGNALOPS_MODEL_PROVIDER: fake

x-backend: &backend
  image: signalops-backend:local
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  environment: *backend-env
  networks: [signalops]

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [signalops]

  redis:
    image: redis:7.4.12-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [signalops]

  kafka:
    image: apache/kafka:4.3.0
    environment:
      CLUSTER_ID: Zd_nwphdQvqoirXhO5osXw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-19094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19094}:19094"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [signalops]

  # One-shot jobs: run to completion on every `up`; both are idempotent.
  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  init-topics:
    <<: *backend
    command: ["init-topics"]
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One instance only: a single publisher keeps each aggregate's events in order.
  outbox-publisher:
    <<: *backend
    command: ["outbox-publisher"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }

  frontend:
    image: signalops-web:local
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8090}:8080"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [signalops]

  backend:
    <<: *backend
    profiles: [tools]
    command: ["--version"]

networks:
  signalops:

volumes:
  postgres-data:
  redis-data:
  kafka-data:
