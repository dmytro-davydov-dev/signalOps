name: signalops

# Local development stack. Single-node Kafka and local volumes give no
# protection against host or disk loss; see docs/reliability.md.
# Stateful services are reachable from the host only on 127.0.0.1.

x-backend-env: &backend-env
  SIGNALOPS_ENVIRONMENT: development
  SIGNALOPS_LOG_LEVEL: ${SIGNALOPS_LOG_LEVEL:-INFO}
  # Application processes connect as the runtime login, which `migrate` creates
  # and which has no privilege on the evaluation schema (migration 0017).
  SIGNALOPS_DATABASE_URL: postgresql+psycopg://signalops_app:${SIGNALOPS_DB_RUNTIME_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}}@postgres:5432/${POSTGRES_DB:-signalops}
  SIGNALOPS_REDIS_URL: redis://redis:6379/0
  SIGNALOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Every process but the worker stays on the fake provider and never sees a key.
  SIGNALOPS_MODEL_PROVIDER: fake
  # JSON object of source ID to ingestion token; empty means no source can ingest.
  SIGNALOPS_INGEST_TOKENS: ${SIGNALOPS_INGEST_TOKENS:-{}}
  # JSON object of workspace ID to operator token for the evidence queries;
  # empty means every operator request is 401.
  SIGNALOPS_OPERATOR_TOKENS: ${SIGNALOPS_OPERATOR_TOKENS:-{}}

# The evaluator's connection: the only one that can read ground truth (ADR-034).
x-evaluation-db: &evaluation-db postgresql+psycopg://signalops_eval:${SIGNALOPS_DB_EVALUATOR_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}}@postgres:5432/${POSTGRES_DB:-signalops}

x-backend: &backend
  image: signalops-backend:local
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  environment: *backend-env
  networks: [signalops]

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [signalops]

  redis:
    image: redis:7.4.12-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [signalops]

  kafka:
    image: apache/kafka:4.3.0
    environment:
      CLUSTER_ID: Zd_nwphdQvqoirXhO5osXw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-19094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19094}:19094"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [signalops]

  # One-shot jobs: run to completion on every `up`; both are idempotent.
  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      # The owner applies migrations and creates or updates the login roles.
      SIGNALOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signalops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-signalops}
      SIGNALOPS_DB_RUNTIME_PASSWORD: ${SIGNALOPS_DB_RUNTIME_PASSWORD:-${POSTGRES_PASSWORD}}
      SIGNALOPS_DB_EVALUATOR_PASSWORD: ${SIGNALOPS_DB_EVALUATOR_PASSWORD:-${POSTGRES_PASSWORD}}
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  init-topics:
    <<: *backend
    command: ["init-topics"]
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Scales by signals.raw.v1 partitions (3); members share the normalizer-v1 group.
  normalizer:
    <<: *backend
    command: ["normalizer"]
    restart: unless-stopped
    # Longer than SIGNALOPS_KAFKA_DELIVERY_TIMEOUT_MS so a quarantine publish can finish.
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }

  # Scales by signals.normalized.v1 partitions (3); members share the detector-v1 group.
  detector:
    <<: *backend
    command: ["detector"]
    restart: unless-stopped
    # Longer than SIGNALOPS_KAFKA_DELIVERY_TIMEOUT_MS so a quarantine publish can finish.
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }

  # Scales by signals.normalized.v1 partitions (3); members share the graph-projector-v1 group.
  graph-projector:
    <<: *backend
    command: ["graph-projector"]
    restart: unless-stopped
    # Longer than SIGNALOPS_KAFKA_DELIVERY_TIMEOUT_MS so a quarantine publish can finish.
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }

  # Creates one durable job per investigation request; members share dispatcher-v1.
  dispatcher:
    <<: *backend
    command: ["dispatcher"]
    restart: unless-stopped
    # Longer than SIGNALOPS_KAFKA_DELIVERY_TIMEOUT_MS so a quarantine publish can finish.
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }

  # Claims jobs and runs their workflow; a stopped worker releases its job.
  investigation-worker:
    <<: *backend
    environment:
      <<: *backend-env
      # `fake` makes no network call. `anthropic` makes paid calls with this key.
      SIGNALOPS_MODEL_PROVIDER: ${SIGNALOPS_MODEL_PROVIDER:-fake}
      SIGNALOPS_MODEL_NAME: ${SIGNALOPS_MODEL_NAME:-}
      SIGNALOPS_MODEL_API_KEY: ${SIGNALOPS_MODEL_API_KEY:-}
      # Fake provider only: seconds before each reply, for the browser journey check.
      SIGNALOPS_FAKE_MODEL_DELAY_SECONDS: ${SIGNALOPS_FAKE_MODEL_DELAY_SECONDS:-0}
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Closes live detection windows by wall clock and evaluates their rules.
  detector-closer:
    <<: *backend
    command: ["detector-closer"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  # One instance only: a single publisher keeps each aggregate's events in order.
  outbox-publisher:
    <<: *backend
    command: ["outbox-publisher"]
    restart: unless-stopped
    # Longer than SIGNALOPS_KAFKA_DELIVERY_TIMEOUT_MS so an in-flight round can finish.
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }

  frontend:
    image: signalops-web:local
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8090}:8080"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [signalops]

  # Demo profile: seed the demo catalog, then post one generated scenario
  # through the ingestion API. Rerun with `docker compose run --rm demo …`.
  demo-seed:
    <<: *backend
    profiles: [demo]
    command: ["seed"]
    restart: "no"
    depends_on:
      migrate: { condition: service_completed_successfully }

  demo:
    <<: *backend
    profiles: [demo]
    command: ["demo-post", "downstream-timeout", "--api-url", "http://api:8000"]
    restart: "no"
    depends_on:
      demo-seed: { condition: service_completed_successfully }
      api: { condition: service_healthy }

  # Demo profile: a small real instrumented checkout application that exports its
  # own telemetry through the ingestion API. bank-gateway really slows past
  # payment's timeout after 4 minutes, for 4 minutes; nothing exported says so.
  # Start it alone with `docker compose --profile demo up -d demo-shop`.
  demo-shop:
    <<: *backend
    profiles: [demo]
    command:
      [
        "demo-shop",
        "--api-url", "http://api:8000",
        "--rate", "1",
        "--run-s", "900",
        "--slow-after-s", "240",
        "--slow-for-s", "240",
      ]
    restart: "no"
    depends_on:
      demo-seed: { condition: service_completed_successfully }
      api: { condition: service_healthy }

  # Evaluation profile: claims queued evaluation runs, replays their scenarios
  # through Kafka, and waits for the investigation workers. Start it with
  # `docker compose --profile evaluation up -d evaluation-worker`.
  evaluation-worker:
    <<: *backend
    profiles: [evaluation]
    environment:
      <<: *backend-env
      SIGNALOPS_EVALUATION_DATABASE_URL: *evaluation-db
    command: ["evaluation-worker"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-topics: { condition: service_completed_successfully }

  backend:
    <<: *backend
    profiles: [tools]
    command: ["--version"]

networks:
  signalops:

volumes:
  postgres-data:
  redis-data:
  kafka-data:
